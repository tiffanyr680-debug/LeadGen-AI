<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeadGen AI | Automated Prospecting Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-main { background: #6366f1; color: white; font-weight: 800; transition: 0.3s; }
        .btn-main:hover { background: #818cf8; transform: scale(1.05); }
        .blur-text { filter: blur(5px); opacity: 0.5; user-select: none; }
        [x-cloak] { display: none !important; }
        @keyframes pulse-radar { 0% { transform: scale(0.95); opacity: 0.5; } 100% { transform: scale(1.5); opacity: 0; } }
        .radar { position: relative; }
        .radar:after { content: ''; position: absolute; inset: -10px; border: 2px solid #6366f1; border-radius: 50%; animation: pulse-radar 2s infinite; }
    </style>
</head>
<body x-data="app()" x-init="init()">

    <!-- LANDING PAGE -->
    <div x-show="mode === 'landing'" class="min-h-screen flex flex-col items-center justify-center px-6 text-center">
        <h1 class="text-6xl md:text-8xl font-black mb-6 tracking-tighter">Locate. <span class="text-indigo-500 italic">Capture.</span></h1>
        <p class="text-slate-500 text-xl max-w-2xl mb-12">The enterprise-grade prospect engine. Locate high-value leads and unlock direct emails instantly.</p>
        <button @click="mode = 'app'" class="btn-main px-12 py-5 rounded-2xl font-black text-xl shadow-2xl">Start Live Demo</button>
    </div>

    <!-- APP DASHBOARD -->
    <div x-show="mode === 'app'" x-cloak class="flex h-screen bg-[#020617]">
        <aside class="w-72 border-r border-white/5 p-8">
            <div class="text-2xl font-black text-indigo-500 mb-12">LeadGen AI</div>
            <nav class="space-y-3">
                <div class="bg-indigo-500/10 text-indigo-400 p-4 rounded-2xl font-bold">🔍 Prospect Radar</div>
                <div class="text-slate-600 p-4 rounded-2xl font-bold flex justify-between">CRM <span class="bg-slate-800 px-2 py-0.5 rounded text-[10px]">LOCKED</span></div>
            </nav>
        </aside>

        <main class="flex-1 p-12 overflow-y-auto">
            <h2 class="text-4xl font-black mb-10">Satellite Discovery</h2>

            <!-- SEARCH CONTROLS -->
            <div class="flex gap-4 mb-12">
                <input x-model="search.niche" placeholder="What industry?" class="flex-1 bg-slate-900 border border-white/10 p-5 rounded-2xl outline-none text-white">
                <input x-model="search.city" placeholder="What city?" class="flex-1 bg-slate-900 border border-white/10 p-5 rounded-2xl outline-none text-white">
                <button @click="runScan()" :disabled="scanning" class="btn-main px-12 rounded-2xl font-black">
                    <span x-text="scanning ? 'SCANNING...' : 'SCAN AREA'"></span>
                </button>
            </div>

            <!-- SCANNING SIMULATION -->
            <div x-show="scanning" class="glass p-10 rounded-[3rem] text-center mb-10 border-indigo-500/30">
                <div class="radar w-16 h-16 bg-indigo-500 rounded-full mx-auto mb-6 flex items-center justify-center text-2xl font-bold">📡</div>
                <h3 class="text-xl font-bold mb-2">Analyzing Digital Footprints in <span class="text-indigo-400 uppercase" x-text="search.city"></span></h3>
                <div class="text-xs font-mono text-slate-500 h-12 overflow-hidden" id="scan-log"></div>
            </div>

            <!-- RESULTS LIST -->
            <div x-show="results.length" class="space-y-6 animate-in slide-in-from-bottom duration-1000">
                <template x-for="res in results">
                    <div class="bg-white/5 p-8 rounded-[2.5rem] border border-white/5 flex justify-between items-center group hover:bg-white/10 transition-all">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="bg-indigo-500/20 text-indigo-400 text-[10px] font-black px-2 py-1 rounded">VERIFIED BUSINESS</span>
                                <h4 class="text-2xl font-bold" x-text="res.name"></h4>
                            </div>
                            <p class="text-slate-500 text-sm mb-4" x-text="res.address"></p>
                            <div class="flex gap-8">
                                <div><span class="text-[10px] font-bold text-slate-600 block uppercase mb-1">Owner Email</span> <span class="text-indigo-400 blur-text">owner@private-domain.com</span></div>
                                <div><span class="text-[10px] font-bold text-slate-600 block uppercase mb-1">Direct Line</span> <span class="text-emerald-400 blur-text">+1 (000) 000-0000</span></div>
                            </div>
                        </div>
                        <button @click="alert('Upgrade to Pro to unlock direct contact data.')" class="bg-indigo-500 text-white font-black px-8 py-4 rounded-2xl shadow-xl hover:scale-105 transition-all">UNLOCK LEAD</button>
                    </div>
                </template>
            </div>
        </main>
    </div>

    <script>
        function app() {
            return {
                mode: 'landing',
                scanning: false,
                search: { niche: '', city: '' },
                results: [],
                init() { console.log('Radar Active'); },
                runScan() {
                    if(!this.search.niche || !this.search.city) return;
                    this.scanning = true;
                    this.results = [];
                    
                    const log = document.getElementById('scan-log');
                    const city = this.search.city;
                    const addresses = [`Checking 102 Main St, ${city}...`, `Scanning Brickell Ave, ${city}...`, `Validating Yelp Records for ${city}...`, `Bypassing Firewalls...`, `Extracting Founder Emails...` ];
                    
                    let i = 0;
                    const interval = setInterval(() => {
                        log.innerText = addresses[i % addresses.length];
                        i++;
                    }, 400);

                    setTimeout(() => {
                        clearInterval(interval);
                        this.scanning = false;
                        this.results = [
                            { name: this.search.niche + " Group", address: "401 Brickell Ave, " + city + ", USA" },
                            { name: "Elite " + this.search.niche + " Solutions", address: "1200 Riverside Dr, " + city + ", USA" }
                        ];
                    }, 3000);
                }
            }
        }
    </script>
</body>
</html>
